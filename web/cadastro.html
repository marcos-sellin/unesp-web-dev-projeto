<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/web/styles/styleCadastro.css" rel="stylesheet">
    <title>Sandrinhos Login</title>
</head>
<body>
    <div class="container-principal">
        <div class="card-login">
    
    
            <div class="texto-login">
                <h3>Ficamos felizes por nos escolher!</h3>
                <p>Faça seu cadastro abaixo</p>
            </div>

            
            <form class="formulario-login">
                <label>Digite seu e-mail</label>
                <input type="text" id="email" placeholder="email@exemplo.com">

                <label>Digite sua senha</label>
                <input type="password" id="senha" placeholder="*******">

                <button type="submit" class="botao-confirma-login">Entrar</button>
            </form>

            <div class="ja-possui-conta">
                <p>Já possui uma conta? <a href="/web/login.html">Faça login aqui!</a></p>
            </div>

        </div>
    </div>
</body>
</html>
