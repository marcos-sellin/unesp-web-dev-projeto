<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/web/styles/styleLogin.css" rel="stylesheet">
    <title>Sandrinhos Login</title>
</head>
<body>
    <img src="./assets/Foto-de-fundo-login.jpg" alt="Cachorro e gato no parque" class="foto-de-fundo-login">

    <div class="container-principal">
        <div class="card-login">
            <div class="texto-login">
                <h3>Que bom te ver de volta por aqui!</h3>
                <p>Faça seu login abaixo</p>
            </div>
            <div>
                <form>
                    <label>Digite seu e-mail</label>
                    <input type="text" placeholder="email@exemplo.com">
                    <br>
                    <label>Digite sua senha</label>
                    <input type="password">
                    <br>
                    <button type="submit" class="botao-confirma-login"></button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
