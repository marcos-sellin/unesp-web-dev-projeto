<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/web/styles/login.css" rel="stylesheet">
    <script src="/web/scripts/auth.js" defer></script>
    <title>Sandrinhos Login</title>
</head>
<body>
    <div class="container-principal">
        <div class="card-login">
    
    
            <div class="texto-login">
                <h3>Que bom te ver de volta por aqui!</h3>
                <p>Faça seu login abaixo</p>
            </div>

            
            <form class="formulario-login">
                <label>Digite seu e-mail</label>
                <input type="text" id="email" placeholder="email@exemplo.com">

                <label>Digite sua senha</label>
                <input type="password" id="senha" placeholder="*******">

                <button type="submit" class="botao-confirma-login">Entrar</button>
            </form>

            <div class="ainda-nao-possui-conta">
                <p>Ainda não possui uma conta? <a href="/web/pages/cadastro.html">Cadastre-se aqui!</a> </p>
            </div>

        </div>
    </div>
</body>
</html>
