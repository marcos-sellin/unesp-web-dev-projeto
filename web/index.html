<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/header.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/footer.css" />
    <link rel="stylesheet" href="./styles/carrinho.css" />
    <title>Sandrinhos Menu</title>
  </head>

  <body>
    <header>
      <a href="./index.html" target="_self" class="logoSite">
        <img src="./assets/SandrinhosLogo.png" alt="SandrinhosLogo" />
      </a>
      <nav>
        <a href="#sobreLoc" class="linkSite">Sobre</a>
        <!-- Leva para a página exclusiva de produtos -->
        <a href="./produtos.html" class="linkSite">Produtos</a>
        <a href="#" class="linkSite">Link 3</a>
      </nav>
      <div class="loginVendasDiv">
        <a href="" class="linkSite">
          <img class="loginIco" src="./assets/LoginIco.png" alt="LoginIcon" />
          <br />Login
        </a>
        <a href="#" id="btn-abrir-carrinho" class="linkSite">
          <span class="cart-icon-wrapper">
            <img class="cartIco" src="./assets/CartIco.png" alt="CartIcon" />
            <span id="contador-carrinho" class="badge-carrinho">0</span>
          </span>
          <br />Vendas
        </a>
      </div>
    </header>

    <main>
      <div>
        <h1 id="sobreLoc">Sandrinhos Petshop</h1>
      </div>
    </main>

    <!-- PAINEL LATERAL (Gaveta vindo da direita) -->
    <div id="modal-carrinho" class="drawer-overlay">
      <div class="drawer-conteudo">
        <div class="drawer-header">
          <h2>🛒 Vendas / Carrinho</h2>
          <button id="btn-fechar-carrinho" class="btn-fechar">&times;</button>
        </div>

        <div id="lista-itens-carrinho" class="drawer-body"></div>

        <div class="drawer-footer">
          <div class="total-container">
            <span>Total do Pedido:</span>
            <strong id="valor-total">R$ 0,00</strong>
          </div>
          <button class="btn-checkout" onclick="irParaCompra()">
            Ir para a Compra
          </button>
        </div>
      </div>
    </div>

    <footer>
      <div class="infoContato">
        <h2>Fale conosco:</h2>
        <p>sandrinhoatendimento@gmail.com</p>
      </div>
      <a href="https://wa.me" target="_blank" class="phoneBtn">
        <img src="./assets/PhoneIco.png" alt="PhoneIcon" class="phoneIco" />
      </a>
    </footer>

    <script src="./scripts/carrinho.js"></script>
  </body>
</html>
